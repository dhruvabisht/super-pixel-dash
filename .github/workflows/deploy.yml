name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for f in js/*.js; do
            node --check "$f"
          done

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html style.css js _site/
          touch _site/.nojekyll

      # Optional: store your Firebase web config as a JSON repository secret named
      # FIREBASE_CONFIG instead of committing it to js/firebase.js.
      - name: Inject Firebase config from repository secret (optional)
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const cfg = JSON.parse(s);
                process.stdout.write("window.SPD_FIREBASE_CONFIG = " + JSON.stringify(cfg) + ";\n");
              });
            ' > _site/js/firebase.tmp.js
            cat _site/js/firebase.js >> _site/js/firebase.tmp.js
            mv _site/js/firebase.tmp.js _site/js/firebase.js
            echo "Injected Firebase config from the FIREBASE_CONFIG secret."
          else
            echo "No FIREBASE_CONFIG secret set; using the config inside js/firebase.js."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
