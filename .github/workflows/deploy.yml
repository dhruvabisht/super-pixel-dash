name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for f in js/*.js; do
            node --check "$f"
          done

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html style.css js _site/
          touch _site/.nojekyll

      # The Firebase web config is not committed (js/firebase-config.js is gitignored).
      # It is stored as the FIREBASE_CONFIG repository secret (JSON) and written out here.
      - name: Generate js/firebase-config.js from the FIREBASE_CONFIG secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const cfg = JSON.parse(s);
                for (const k of ["apiKey", "authDomain", "projectId", "appId"]) {
                  if (!cfg[k]) { console.error("FIREBASE_CONFIG is missing " + k); process.exit(1); }
                }
                process.stdout.write("window.SPD_FIREBASE_CONFIG = " + JSON.stringify(cfg) + ";\n");
              });
            ' > _site/js/firebase-config.js
            echo "Wrote js/firebase-config.js from the FIREBASE_CONFIG secret."
          else
            echo "// No FIREBASE_CONFIG secret set: the game runs with local scores only." > _site/js/firebase-config.js
            echo "No FIREBASE_CONFIG secret set; deploying without Firebase."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
